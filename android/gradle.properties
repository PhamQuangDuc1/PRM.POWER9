# Keep Gradle bounded on the 16 GB development machine alongside Flutter/Chrome.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Pub cache is on C: while this project is on D:. Kotlin incremental caches
# cannot relativize plugin sources across these Windows drive roots.
kotlin.incremental=false
