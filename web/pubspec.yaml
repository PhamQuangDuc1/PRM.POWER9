publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cloud_firestore: 7.1.0
  firebase_analytics: 13.0.1
  firebase_app_check: ^0.5.1
  firebase_auth: 7.0.1
