ace-xs": "0.25rem" }, fontFamily: { "body-lg": ["Be Vietnam Pro"], "headline-lg-mobile": ["Be Vietnam Pro"], "label-md": ["Be Vietnam Pro"], "body-md": ["Be Vietnam Pro"], "headline-sm": ["Be Vietnam Pro"], "headline-md": ["Be Vietnam Pro"], "label-lg": ["Be Vietnam Pro"], "headline-lg": ["Be Vietnam Pro"], "label-sm": ["Be Vietnam Pro"], "body-sm": ["Be Vietnam Pro"] }, fontSize: { "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }], "headline-lg-mobile": ["22px", { lineHeight: "28px", letterSpacing: "-0.01em", fontWeight: "700" }], "label-md": ["14px", { lineHeight: "20px", fontWeight: "500" }], "body-md": ["16px", { lineHeight: "24px", fontWeight: "500" }], "headline-sm": ["18px", { lineHeight: "24px", fontWeight: "600" }], "headline-md": ["20px", { lineHeight: "26px", fontWeight: "600" }], "label-lg": ["14px", { lineHeight: "20px", letterSpacing: "0.02em", fontWeight: "600" }], "headline-lg": ["24px", { lineHeight: "32px", letterSpacing: "-0.01em", fontWeight: "700" }], "label-sm": ["12px", { lineHeight: "16px", letterSpacing: "0.04em", fontWeight: "500" }], "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }] } } } }</script><style>@layer base{html,body{width:100%;margin:0;padding:0;}body{overscroll-behavior-y:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe"><div class="h-16 px-gutter flex items-center justify-between"><div class="flex items-center gap-space-xs"><button aria-label="Quay lại" class="min-w-[48px] min-h-[48px] flex items-center gap-1 text-on-surface hover:text-primary" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span><span class="font-label-md text-label-md font-semibold">Quay lại</span></button><h1 class="font-headline-sm text-headline-sm text-on-surface font-semibold tracking-tight truncate ml-space-xs">Chi Tiết Thói Quen</h1></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex flex-col relative w-full px-gutter pt-16 pb-safe bg-surface flex-1"><div class="flex flex-col w-full pb-8">

      Tìm thói quen

<span class="material-symbols-outlined absolute left-3 text-secondary text-[22px] pointer-events-none select-none">

</div>
</section>
<!-- Filter Chips Row -->
<section aria-label="Bộ lọc thời gian" class="flex items-center gap-space-sm mt-space-lg overflow-x-auto py-1 no-scrollbar" role="tablist">

<span class="material-symbols-outlined text-[18px] text-on-primary">

      </span>
<span>5 phút</span>
</button>
<!-- Chip 3: 10 phút -->
<button aria-selected="false" class="min-h-[48px] px-4 py-2 rounded-lg bg-surface-container-lowest text-secondary font-label-md text-label-md flex items-center justify-center shrink-0 active:bg-surface-container transition-colors" role="tab" style="border: 1.5px solid #c4c7c7;" type="button">
      10 phút
    </button>
</section>
<!-- Result List Section Header -->
<div class="flex items-center justify-between mt-space-lg mb-space-sm">

          Thở chậm

<span class="inline-flex items-center gap-1 px-2.5 py-1 bg-surface-container-highest text-on-surface font-label-sm text-label-sm rounded-md shrink-0" style="border: 1px solid #c4c7c7;">
<span class="material-symbols-outlined text-[14px]">schedule</span>

        </span>
</div>
<!-- Description -->
<p class="font-body-sm text-body-sm text-on-surface-variant mb-space-lg leading-relaxed">

      </p>
<!-- Action Button -->
<button class="w-full min-h-[48px] h-12 px-space-md bg-primary text-on-primary rounded-lg font-body-md text-body-md font-semibold flex items-center justify-center gap-2 active:bg-neutral-800 transition-colors" type="button">
<span>Xem chi tiết</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</article>
<!-- Card 2: Gọi hỏi thăm người thân -->
<article class="flex flex-col bg-surface-container-low rounded-xl p-space-md" style="border: 1.5px solid #d1d5db;">

<div class="flex items-start justify-between gap-space-sm mb-space-xs">
<h3 class="font-headline-md text-headline-md text-on-surface font-semibold leading-tight">
          Gọi hỏi thăm người thân

        </span>

<p class="font-body-sm text-body-sm text-on-surface-variant mb-space-lg leading-relaxed">

      </p>
<!-- Action Button -->
<button class="w-full min-h-[48px] h-12 px-space-md bg-primary text-on-primary rounded-lg font-body-md text-body-md font-semibold flex items-center justify-center gap-2 active:bg-neutral-800 transition-colors" type="button">
<span>Xem chi tiết</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</article>
</div>
