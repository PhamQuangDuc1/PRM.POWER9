<div class="flex items-center justify-between mb-space-md">
<span class="text-headline font-headline text-on-surface">Thư giãn</span>
<span class="material-symbols-outlined text-secondary hover:text-on-surface transition-colors cursor-pointer text-[24px]">volume_up</span>
</div>
<div class="flex flex-col items-start mb-space-lg">
<div class="inline-flex items-center bg-surface-variant text-primary-container px-3 py-1 rounded-full">
<span class="text-label font-label text-[12px] leading-none uppercase tracking-wider font-semibold">QUẢN LÝ CĂNG THẲNG</span>
</div>
<h2 class="text-display font-display text-on-surface mt-2 mb-2">Nghỉ sau cuộc họp</h2>
<p class="text-body font-body text-on-surface-variant">Thả lỏng và thở tự nhiên.</p>
</div>
<div class="bg-surface-container-lowest rounded-xl p-space-xl shadow-sm flex flex-col items-center justify-center text-center mb-space-lg relative overflow-hidden">
<div class="absolute -top-12 -right-12 w-32 h-32 bg-surface-container rounded-full opacity-60 pointer-events-none"></div>
<div class="absolute -bottom-12 -left-12 w-32 h-32 bg-surface-variant rounded-full opacity-30 pointer-events-none"></div>
<span class="text-label font-label text-on-surface-variant mb-2 relative z-10">Thời lượng khuyến nghị</span>
<div class="my-4 relative z-10 flex items-center justify-center">
<span class="font-display text-[32px] font-bold tracking-wider text-on-surface tabular-nums" id="timer-display" style="font-variant-numeric: tabular-nums;">03:00</span>
</div>
<div class="inline-flex items-center gap-1.5 bg-surface-variant text-primary-container px-4 py-1.5 rounded-full relative z-10">
<span class="w-2 h-2 rounded-full bg-primary-container"></span>
<span class="text-label font-label font-semibold" id="timer-status">Chưa bắt đầu</span>
</div>
</div>
<div class="w-full mt-auto">
<button class="w-full h-[52px] min-h-[48px] bg-primary-container hover:bg-primary text-on-primary font-body-medium rounded-xl flex items-center justify-center gap-space-sm shadow-sm transition-all active:scale-[0.99] cursor-pointer" id="cta-button" type="button">
<span class="material-symbols-outlined text-[20px]" id="cta-icon" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
<span class="text-body-medium font-body-medium" id="cta-text">Bắt đầu</span>
</button>
</div>
</div>
<script>
  (() => {
    const ctaBtn = document.getElementById('cta-button');
    const timerDisplay = document.getElementById('timer-display');
    const timerStatus = document.getElementById('timer-status');
    const ctaIcon = document.getElementById('cta-icon');
    const ctaText = document.getElementById('cta-text');

    let totalSeconds = 180;
    let timerId = null;
    let isRunning = false;

    function renderTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    ctaBtn.addEventListener('click', () => {
      if (!isRunning) {
        isRunning = true;
        ctaText.textContent = 'Tạm dừng';
        ctaIcon.textContent = 'pause';
        timerStatus.textContent = 'Đang thư giãn';
        
        timerId = setInterval(() => {
          if (totalSeconds > 0) {
            totalSeconds--;
            timerDisplay.textContent = renderTime(totalSeconds);
          } else {
            clearInterval(timerId);
            isRunning = false;
            ctaText.textContent = 'Hoàn thành';
            ctaIcon.textContent = 'check';
            timerStatus.textContent = 'Đã hoàn tất';
          }
        }, 1000);
      } else {
        clearInterval(timerId);
        isRunning = false;
        ctaText.textContent = 'Tiếp tục';
        ctaIcon.textContent = 'play_arrow';
        timerStatus.textContent = 'Đang tạm dừng';
      }
    });
  })();
</script></main><nav class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface/95 backdrop-blur-xl shadow-[0_-2px_12px_rgba(3,28,54,0.05)]" data-active-classes="bg-surface-variant text-primary-container font-semibold"><div class="flex justify-around items-center h-20 px-space-xs"><a class="flex flex-col items-center justify-center gap-0.5 min-w-[72px] min-h-[48px] py-1.5 px-2 rounded-xl text-on-surface-variant transition-all" data-path="hom-nay" href="#"><span class="material-symbols-outlined text-[24px]">today</span><span class="text-[14px] leading-tight font-medium">Hôm nay</span></a><a class="flex flex-col items-center justify-center gap-0.5 min-w-[72px] min-h-[48px] py-1.5 px-2 rounded-xl text-on-surface-variant transition-all" data-path="an-uong" href="#"><span class="material-symbols-outlined text-[24px]">restaurant</span><span class="text-[14px] leading-tight font-medium">Ăn uống</span></a><a class="flex flex-col items-center justify-center gap-0.5 min-w-[72px] min-h-[48px] py-1.5 px-2 rounded-xl bg-surface-variant text-primary-container font-semibold transition-all" data-path="thu-gian" href="#"><span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">spa</span><span class="text-[14px] leading-tight font-medium">Thư giãn</span></a><a class="flex flex-col items-center justify-center gap-0.5 min-w-[72px] min-h-[48px] py-1.5 px-2 rounded-xl text-on-surface-variant transition-all" data-path="ket-noi" href="#"><span class="material-symbols-outlined text-[24px]">groups</span><span class="text-[14px] leading-tight font-medium">Kết nối</span></a></div></nav></body></html>
