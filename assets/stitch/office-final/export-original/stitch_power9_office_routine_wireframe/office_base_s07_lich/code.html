<script>
  (function() {
    const toggleBtn = document.getElementById('reminder-toggle-btn');
    const thumb = document.getElementById('reminder-thumb');
    const reminderGroup = document.getElementById('reminder-time-group');
    let isChecked = true;

    if (toggleBtn && thumb && reminderGroup) {
      toggleBtn.addEventListener('click', function() {
        isChecked = !isChecked;
        toggleBtn.setAttribute('aria-checked', isChecked ? 'true' : 'false');
        if (isChecked) {
          toggleBtn.classList.remove('bg-surface-container-highest');
          toggleBtn.classList.add('bg-primary');
          thumb.classList.remove('translate-x-0');
          thumb.classList.add('translate-x-5');
          reminderGroup.classList.remove('hidden');
        } else {
          toggleBtn.classList.remove('bg-primary');
          toggleBtn.classList.add('bg-surface-container-highest');
          thumb.classList.remove('translate-x-5');
          thumb.classList.add('translate-x-0');
          reminderGroup.classList.add('hidden');
        }
      });
    }
  })();
</script></main>
