"material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="text-[20px] font-semibold text-[#222222] tracking-tight truncate">Góc làm việc</h1></div></header><main class="flex-1 flex flex-col relative w-full pt-14 pb-safe bg-white"><div class="flex flex-col w-full max-w-lg mx-auto px-4 py-4 pb-safe"><div class="mb-4"><p class="text-[14px] text-[#666666] mb-1">Ngồi đúng tư thế · Không gian làm việc</p><div class="flex items-baseline justify-between"><h2 class="text-[18px] font-semibold text-[#222222]">Kiểm tra góc làm việc</h2><span class="text-[14px] text-[#666666]">2 phút</span></div><p class="text-[14px] text-[#666666] mt-2">Đánh dấu nhanh các mục để đảm bảo tư thế chuẩn và khu vực làm việc gọn gàng, hiệu quả.</p></div><div class="border-t border-b border-[#BDBDBD] my-2 divide-y divide-[#BDBDBD]"><label class="flex items-center gap-3 min-h-[48px] py-3 cursor-pointer select-none"><input class="sr-only peer" id="check-1" onchange="updateProgress()" type="checkbox"><div class="w-5 h-5 border border-[#222222] rounded-none bg-white flex items-center justify-center shrink-0 peer-checked:bg-[#222222]"><span class="material-symbols-outlined text-[16px] text-white hidden peer-checked:block">check</span></div><span class="text-[14px] text-[#222222] flex-1">Màn hình ở vị trí thuận tiện.</span></label><label class="flex items-center gap-3 min-h-[48px] py-3 cursor-pointer select-none"><input class="sr-only peer" id="check-2" onchange="updateProgress()" type="checkbox"><div class="w-5 h-5 border border-[#222222] rounded-none bg-white flex items-center justify-center shrink-0 peer-checked:bg-[#222222]"><span class="material-symbols-outlined text-[16px] text-white hidden peer-checked:block">check</span></div><span class="text-[14px] text-[#222222] flex-1">Ghế và tư thế thoải mái.</span></label><label class="flex items-center gap-3 min-h-[48px] py-3 cursor-pointer select-none"><input class="sr-only peer" id="check-3" onchange="updateProgress()" type="checkbox"><div class="w-5 h-5 border border-[#222222] rounded-none bg-white flex items-center justify-center shrink-0 peer-checked:bg-[#222222]"><span class="material-symbols-outlined text-[16px] text-white hidden peer-checked:block">check</span></div><span class="text-[14px] text-[#222222] flex-1">Mặt bàn và lối đi gọn.</span></label></div><div class="flex items-center justify-between text-[13px] text-[#666666] my-3"><span id="progress-text" class="">Đã chọn 0/3 mục</span><span id="feedback-hint" class="">Có thể xác nhận bất kỳ lúc nào</span></div><div class="mt-6"><button class="w-full h-[52px] bg-[#222222] text-white text-[15px] font-medium rounded-none flex items-center justify-center gap-2 active:bg-neutral-800 transition-colors" id="submit-btn" onclick="handleComplete()"><span class="material-symbols-outlined text-[20px]">check</span><span class="">Đã kiểm tra</span></button></div></div><script>function updateProgress(){const checkboxes=[document.getElementById('check-1'),document.getElementById('check-2'),document.getElementById('check-3')];const checkedCount=checkboxes.filter(cb=>cb&&cb.checked).length;const progressText=document.getElementById('progress-text');const feedbackHint=document.getElementById('feedback-hint');if(progressText){progressText.textContent=`Đã chọn ${checkedCount}/3 mục`;}if(feedbackHint){if(checkedCount===3){feedbackHint.textContent='Đã hoàn thành toàn bộ mục!';}else if(checkedCount>0){feedbackHint.textContent='Rất tốt, tiếp tục duy trì';}else{feedbackHint.textContent='Có thể xác nhận bất kỳ lúc nào';}}}function handleComplete(){const btn=document.getElementById('submit-btn');if(btn){btn.innerHTML='<span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span><span>Đang lưu...</span>';}setTimeout(()=>{window.history.back();},350);}</script></main>
