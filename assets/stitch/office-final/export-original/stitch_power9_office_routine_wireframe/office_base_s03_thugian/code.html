> { const timerDisplay = document.getElementById('timer-display'); const statusDisplay = document.getElementById('session-status'); const controlBtn = document.getElementById('timer-control-btn'); const resetBtn = document.getElementById('reset-control-btn'); let totalSeconds = 180; let currentSeconds = totalSeconds; let timerId = null; let isRunning = false; const formatTime = (secs) => { const m = Math.floor(secs / 60).toString().padStart(2, '0'); const s = (secs % 60).toString().padStart(2, '0'); return `${m}:${s}`; }; const updateUI = () => { timerDisplay.textContent = formatTime(currentSeconds); if (isRunning) { controlBtn.innerHTML = '<span class="material-symbols-outlined" style="font-size: 20px;">pause</span><span>Tạm dừng</span>'; statusDisplay.textContent = 'Đang diễn ra'; resetBtn.style.display = 'flex'; } else { controlBtn.innerHTML = currentSeconds < totalSeconds ? '<span class="material-symbols-outlined" style="font-size: 20px;">play_arrow</span><span>Tiếp tục</span>' : '<span class="material-symbols-outlined" style="font-size: 20px;">play_arrow</span><span>Bắt đầu</span>'; statusDisplay.textContent = currentSeconds === 0 ? 'Đã hoàn tất thời gian' : (currentSeconds < totalSeconds ? 'Tạm dừng' : 'Chưa bắt đầu'); } }; controlBtn.addEventListener('click', () => { if (isRunning) { clearInterval(timerId); isRunning = false; updateUI(); } else { if (currentSeconds <= 0) { currentSeconds = totalSeconds; } isRunning = true; updateUI(); timerId = setInterval(() => { if (currentSeconds > 0) { currentSeconds -= 1; timerDisplay.textContent = formatTime(currentSeconds); } else { clearInterval(timerId); isRunning = false; updateUI(); } }, 1000); } }); resetBtn.addEventListener('click', () => { clearInterval(timerId); isRunning = false; currentSeconds = totalSeconds; resetBtn.style.display = 'none'; updateUI(); }); })();</script></main><nav class="fixed bottom-0 inset-x-0 z-50 pb-safe" style="background-color: rgb(255, 255, 255); border-top: 1px solid rgb(189, 189, 1
