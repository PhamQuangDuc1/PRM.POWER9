</head><body class="bg-surface font-body text-on-surface flex flex-col min-h-screen antialiased"><header class="fixed top-0 inset-x-0 z-50 bg-surface/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(3,28,54,0.04)] pt-safe"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-xs min-w-0 flex-1"><button aria-label="Quay lại" class="w-12 h-12 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-variant/40 active:bg-surface-variant transition-colors flex-shrink-0" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="text-headline font-headline text-on-surface truncate pr-2">Lịch thói quen</h1></div><div class="flex items-center gap-space-sm flex-shrink-0"><img alt="Profile" class="w-8 h-8 rounded-full object-cover shadow-[0_1px_4px_rgba(3,28,54,0.08)]" src="https://lh3.googleusercontent.com/aida/AEtjO1W_CdcPeLqpT_RR0Bo3e6SD5KJoJNTytyT9mmFK6oQNN6sZXzFRK683TQthuSvpsJW5N3WExV_ri26dNT-luMTbdzN5QcyiqmSvamkSov5zCZQliz0JhpgdAQluEdJ-LFkillSSTjsNSU-f2qRqBIfrAoxgzHj8zhUzK8VHYYjdg18ZAnPenhKcN9BCAtUvDwf7WZy0_FrtvewpTyHu0StmVrb9R9Aqd7II-_14n2Goz1iEMKHQkNPsEQ6Z3HypDmDeSiaudF9u"/></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 pb-safe bg-surface min-h-screen"><div class="flex-1 pb-space-xl"><div class="flex flex-col w-full px-margin pt-space-md">
<!-- Visual Header Hero Banner -->
<!-- Activity Summary Card -->
<div class="bg-surface-container-lowest rounded-xl p-space-md shadow-sm mb-space-md flex items-center justify-between"><div class="flex items-center gap-space-sm min-w-0 pr-2"><div class="w-12 h-12 rounded-full bg-primary-fixed flex items-center justify-center text-primary flex-shrink-0"><span class="material-symbols-outlined text-[24px]">directions_walk</span></div><div class="min-w-0"><h2 class="text-[18px] font-headline text-on-surface leading-snug">Rủ đồng nghiệp đi bộ</h2><p class="text-helper font-helper text-on-surface-variant">5 phút</p></div></div><span class="bg-surface-container text-primary text-label font-label px-2.5 py-1 rounded-lg flex-shrink-0">Thực hiện 1 lần</span></div>
<!-- Date Field Card -->
<div class="bg-surface-container-lowest rounded-xl p-space-md shadow-sm mb-space-md">
<label class="text-body-medium font-body-medium text-on-surface mb-1.5 flex items-center gap-1.5" for="date-selector"><span class="material-symbols-outlined text-primary text-[18px]">calendar_today</span><span>Ngày thực hiện</span></label>
<button class="w-full h-[52px] bg-surface-container-low rounded-lg px-space-md flex items-center justify-between text-body font-body text-on-surface active:bg-surface-container transition-colors" id="date-selector" type="button">
<span class="font-medium">Thứ Hai, 26/10/2026</span>
<span class="material-symbols-outlined text-secondary text-[22px]">edit_calendar</span>
</button>
</div>
<!-- Reminder Toggle Card -->
<div class="bg-surface-container-lowest rounded-xl p-space-md shadow-sm mb-space-md">
<!-- Toggle Row -->
<div class="flex items-center justify-between min-h-[48px]">
<div class="flex items-center gap-2.5">
<div class="w-10 h-10 rounded-lg bg-surface-container flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[22px]" id="bell-icon">notifications_active</span>
</div>
<div>
<span class="text-body-medium font-body-medium text-on-surface block">Nhắc tôi</span>
<span class="text-helper font-helper text-on-surface-variant" id="reminder-desc">Báo trước giờ vận động</span>
</div>
</div>
<button aria-checked="true" aria-label="Bật nhắc nhở" class="bg-primary-container w-14 h-8 rounded-full flex items-center px-1 cursor-pointer transition-colors duration-200 justify-end flex-shrink-0" id="reminder-toggle" role="switch">
<span class="w-6 h-6 rounded-full bg-surface-container-lowest shadow-sm transition-transform duration-200" id="toggle-thumb"></span>
</button>
</div>
<!-- Time Input Row -->
<div class="pt-space-sm mt-space-sm transition-all duration-200" id="time-input-section">
<label class="text-body-medium font-body-medium text-on-surface mb-1.5 flex items-center gap-1.5" for="time-picker-btn"><span class="material-symbols-outlined text-primary text-[18px]">schedule</span><span>Giờ nhắc (24h)</span></label>
<div class="h-[52px] bg-surface-container rounded-lg px-space-md flex items-center justify-between">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[20px]">alarm</span>
<span class="text-headline font-headline text-on-surface tracking-wider">12:00</span>
</div>
<button aria-label="Thay đổi giờ nhắc" class="h-10 px-3 bg-surface-container-lowest text-primary rounded-lg text-label font-label flex items-center gap-1 shadow-sm active:bg-surface-variant transition-colors" id="time-picker-btn" type="button">
<span>Thay đổi</span>
<span class="material-symbols-outlined text-[16px]">expand_more</span>
</button>
</div>
</div>
</div>
<!-- Quiet Hours Card -->
<div class="bg-surface-container-lowest rounded-xl p-space-md shadow-sm mb-space-lg">
<div class="flex items-center gap-2 mb-1.5">
<div class="w-7 h-7 rounded-full bg-surface-container flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[18px]">bedtime</span>
</div>
<h3 class="text-body-medium font-body-medium text-on-surface font-medium">Giờ yên lặng</h3>
</div>
<div class="inline-block bg-surface-container-low px-3 py-1.5 rounded-lg mb-2">
<span class="text-body-medium font-body-medium text-primary">18:00 – 08:00 hôm sau</span>
</div>
<p class="text-helper font-helper text-on-surface-variant leading-relaxed">
      Không phát thông báo trong giờ yên lặng; bạn vẫn có thể lên lịch hoạt động.
    </p>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-3 pb-space-md">
<button class="h-[52px] w-full min-h-[48px] bg-primary text-on-primary font-headline text-[16px] rounded-xl flex items-center justify-center gap-2 shadow-sm active:opacity-90 transition-opacity" id="btn-save" type="button"><span class="material-symbols-outlined text-[20px]">save</span><span>Lưu lịch</span></button>
<button class="h-[52px] w-full min-h-[48px] bg-surface-container-lowest text-secondary font-body-medium text-body rounded-xl flex items-center justify-center gap-2 shadow-sm active:bg-surface-container-low transition-colors" id="btn-cancel" onclick="history.back()" type="button">
<span>Hủy</span>
</button>
</div>
</div>
<script>
  (function() {
    const toggleBtn = document.getElementById('reminder-toggle');
    const timeSection = document.getElementById('time-input-section');
    const bellIcon = document.getElementById('bell-icon');
    const reminderDesc = document.getElementById('reminder-desc');
    let isOn = true;

    if (toggleBtn && timeSection) {
      toggleBtn.addEventListener('click', function() {
        isOn = !isOn;
        toggleBtn.setAttribute('aria-checked', isOn ? 'true' : 'false');
        
        if (isOn) {
          toggleBtn.className = 'bg-primary-container w-14 h-8 rounded-full flex items-center px-1 cursor-pointer transition-colors duration-200 justify-end flex-shrink-0';
          timeSection.style.display = 'block';
          bellIcon.innerText = 'notifications_active';
          reminderDesc.innerText = 'Báo trước giờ vận động';
        } else {
          toggleBtn.className = 'bg-secondary-container w-14 h-8 rounded-full flex items-center px-1 cursor-pointer transition-colors duration-200 justify-start flex-shrink-0';
          timeSection.style.display = 'none';
          bellIcon.innerText = 'notifications_off';
          reminderDesc.innerText = 'Tắt thông báo hoạt động';
        }
      });
    }

    const saveBtn = document.getElementById('btn-save');
    if (saveBtn) {
      saveBtn.addEventListener('click', function() {
        const originalContent = saveBtn.innerHTML;
        saveBtn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">refresh</span><span>Đang lưu...</span>';
        saveBtn.disabled = true;
        setTimeout(() => {
          saveBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">check_circle</span><span>Đã lưu thành công!</span>';
          setTimeout(() => {
            history.back();
          }, 600);
        }, 800);
      });
    }
  })();
</script></div></main></body></html>
