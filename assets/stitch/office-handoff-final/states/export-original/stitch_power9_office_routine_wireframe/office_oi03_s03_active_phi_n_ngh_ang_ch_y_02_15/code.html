  </head><body class="bg-surface font-body text-on-surface flex flex-col min-h-screen antialiased"><header class="fixed top-0 inset-x-0 z-50 bg-surface/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(3,28,54,0.04)] pt-safe"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-xs min-w-0 flex-1"><button aria-label="Quay lại" class="w-12 h-12 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-variant/40 active:bg-surface-variant transition-colors flex-shrink-0" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="text-headline font-headline text-on-surface truncate pr-2">Chi tiết thói quen</h1></div><div class="flex items-center gap-space-sm flex-shrink-0"><img alt="Profile" class="w-8 h-8 rounded-full object-cover shadow-[0_1px_4px_rgba(3,28,54,0.08)]" src="https://lh3.googleusercontent.com/aida/AEtjO1W_CdcPeLqpT_RR0Bo3e6SD5KJoJNTytyT9mmFK6oQNN6sZXzFRK683TQthuSvpsJW5N3WExV_ri26dNT-luMTbdzN5QcyiqmSvamkSov5zCZQliz0JhpgdAQluEdJ-LFkillSSTjsNSU-f2qRqBIfrAoxgzHj8zhUzK8VHYYjdg18ZAnPenhKcN9BCAtUvDwf7WZy0_FrtvewpTyHu0StmVrb9R9Aqd7II-_14n2Goz1iEMKHQkNPsEQ6Z3HypDmDeSiaudF9u"/></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 pb-safe bg-surface min-h-screen"><div class="flex flex-col w-full px-margin pb-space-xl">
<!-- Status Tag & Context Header -->
<div class="flex flex-col items-center text-center mt-space-md mb-space-lg">
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container text-primary mb-space-sm shadow-sm">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">spa</span>
<span class="font-label text-label font-bold uppercase tracking-wider text-[11px] leading-none">QUẢN LÝ CĂNG THẲNG</span>
</div>
<h2 class="font-display text-display text-on-surface mb-space-xs">Nghỉ sau cuộc họp</h2>
<p class="font-body text-body text-on-surface-variant max-w-xs">Thả lỏng cơ thể và hít thở tự nhiên theo nhịp đếm.</p>
</div>
<!-- Ambient Breathing Ring & Timer Card -->
<div class="relative flex flex-col items-center justify-center p-space-lg rounded-2xl bg-surface-container-lowest shadow-sm mb-space-lg">
<!-- Breathing visual aura -->
<div class="relative w-64 h-64 flex items-center justify-center">
<!-- Animated outer breathing ripples -->
<div class="absolute inset-0 rounded-full bg-surface-container-high/40 transition-transform duration-[3000ms] ease-in-out scale-100" id="breathPulse"></div>
<div class="absolute inset-4 rounded-full bg-surface-container-low transition-transform duration-[3000ms] ease-in-out scale-95"></div>
<!-- SVG Progress Track -->
<svg class="w-56 h-56 -rotate-90 transform relative z-10" viewbox="0 0 200 200">
<circle class="text-surface-container" cx="100" cy="100" fill="transparent" r="88" stroke="currentColor" stroke-width="8"></circle>
<circle class="text-primary-container transition-all duration-1000 ease-linear" cx="100" cy="100" fill="transparent" id="progressCircle" r="88" stroke="currentColor" stroke-dasharray="552.92" stroke-dashoffset="138" stroke-linecap="round" stroke-width="8"></circle>
</svg>
<!-- Center Info -->
<div class="absolute inset-0 flex flex-col items-center justify-center z-20 select-none">
<div class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-surface-container mb-2">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<span class="font-label text-label text-primary font-semibold text-[12px]" id="statusLabel">Đang diễn ra</span>
</div>
<div class="font-headline text-[40px] leading-[48px] font-bold text-on-surface tracking-tight" id="timerDisplay" style="font-feature-settings: 'tnum';">02:15</div>
<p class="font-label text-label text-on-surface-variant text-[13px] mt-1 transition-opacity duration-700" id="breathCue">Hít vào thật sâu...</p>
</div>
</div>
<!-- Soft Sound / Ambient Indicator -->
<div class="flex items-center gap-2 mt-4 px-3 py-1.5 rounded-full bg-surface-container-low text-on-surface-variant">
<span class="material-symbols-outlined text-[18px] text-primary">waves</span>
<span class="font-helper text-helper text-[12px]">Âm thanh chuông thư giãn: Bật</span>
</div>
</div>
<!-- Informational Callout / Progress Note -->
<div class="flex items-start gap-3 p-space-md rounded-xl bg-surface-container-low mb-space-xl">
<span class="material-symbols-outlined text-primary text-[20px] mt-0.5" style="font-variation-settings: 'FILL' 1;">info</span>
<p class="font-helper text-helper text-on-surface-variant">Chưa kết thúc thì chưa hoàn thành và chưa ghi nhận vào tiến độ.</p>
</div>
<!-- Action Controls -->
<div class="flex flex-col gap-3 w-full">
<!-- Primary Pause / Resume Button -->
<button class="w-full h-[52px] px-5 rounded-xl bg-primary-container hover:bg-primary active:scale-[0.99] transition-all flex items-center justify-center gap-2 text-on-primary font-body-medium text-body-medium shadow-sm cursor-pointer" id="btnPause" type="button">
<span class="material-symbols-outlined text-[24px]" id="pauseIcon">pause</span>
<span id="pauseText">Tạm dừng</span>
</button>
<!-- Secondary End Button -->
<button class="w-full h-[52px] px-5 rounded-xl bg-surface-container-lowest hover:bg-surface-container-low active:scale-[0.99] transition-all flex items-center justify-center gap-2 text-secondary font-body-medium text-body-medium shadow-sm cursor-pointer" id="btnStop" type="button">
<span class="material-symbols-outlined text-[24px]">stop</span>
<span>Kết thúc</span>
</button>
</div>
</div>
<script>
  (function() {
    let timeLeft = 135; // 2 minutes 15 seconds
    const totalTime = 180; // 3 minutes full session
    let isPaused = false;
    let timerInterval = null;
    let breathState = 0; // 0: hit vao, 1: tho ra

    const timerDisplay = document.getElementById('timerDisplay');
    const progressCircle = document.getElementById('progressCircle');
    const btnPause = document.getElementById('btnPause');
    const pauseIcon = document.getElementById('pauseIcon');
    const pauseText = document.getElementById('pauseText');
    const btnStop = document.getElementById('btnStop');
    const breathCue = document.getElementById('breathCue');
    const breathPulse = document.getElementById('breathPulse');
    const statusLabel = document.getElementById('statusLabel');

    const circumference = 2 * Math.PI * 88;

    function updateDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      
      const fraction = (totalTime - timeLeft) / totalTime;
      const offset = circumference * (1 - fraction);
      progressCircle.style.strokeDashoffset = offset;
    }

    // Gentle breathing loop guidance
    const breathInterval = setInterval(() => {
      if (isPaused || timeLeft <= 0) return;
      breathState = (breathState + 1) % 2;
      if (breathState === 0) {
        breathCue.textContent = 'Hít vào thật sâu...';
        breathPulse.style.transform = 'scale(1.12)';
      } else {
        breathCue.textContent = 'Thở ra chậm rãi...';
        breathPulse.style.transform = 'scale(0.96)';
      }
    }, 3500);

    timerInterval = setInterval(() => {
      if (!isPaused && timeLeft > 0) {
        timeLeft--;
        updateDisplay();
        if (timeLeft === 0) {
          clearInterval(timerInterval);
          statusLabel.textContent = 'Hoàn thành';
          breathCue.textContent = 'Tuyệt vời! Bạn đã hoàn thành phiên nghỉ.';
          pauseText.textContent = 'Bắt đầu lại';
          pauseIcon.textContent = 'replay';
        }
      }
    }, 1000);

    btnPause.addEventListener('click', () => {
      if (timeLeft === 0) {
        timeLeft = 135;
        isPaused = false;
        pauseText.textContent = 'Tạm dừng';
        pauseIcon.textContent = 'pause';
        statusLabel.textContent = 'Đang diễn ra';
        updateDisplay();
        return;
      }
      isPaused = !isPaused;
      if (isPaused) {
        pauseIcon.textContent = 'play_arrow';
        pauseText.textContent = 'Tiếp tục';
        statusLabel.textContent = 'Đã tạm dừng';
        breathCue.textContent = 'Phiên nghỉ đang tạm dừng';
        breathPulse.style.transform = 'scale(1)';
      } else {
        pauseIcon.textContent = 'pause';
        pauseText.textContent = 'Tạm dừng';
        statusLabel.textContent = 'Đang diễn ra';
        breathCue.textContent = 'Hít vào thật sâu...';
      }
    });

    btnStop.addEventListener('click', () => {
      if (confirm('Bạn có chắc muốn kết thúc? Phiên nghỉ sẽ chưa được ghi nhận hoàn thành.')) {
        clearInterval(timerInterval);
        clearInterval(breathInterval);
        history.back();
      }
    });

    updateDisplay();
  })();
</script></main></body></html>
