<div aria-describedby="dialogDesc" aria-labelledby="dialogTitle" aria-modal="true" class="bg-surface-container-lowest w-full max-w-sm rounded-[16px] p-6 shadow-[0_12px_32px_rgba(21,44,70,0.12)] flex flex-col items-center text-center transform transition-transform duration-300 scale-100" id="dialogBox" role="dialog">
<!-- Icon cảnh báo nhẹ nhàng (#1E5AA8, nền #EAF2FC, tròn 48px) -->
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-primary-container mb-space-md shadow-[0_2px_8px_rgba(30,90,168,0.1)]">
<span class="material-symbols-outlined text-[26px]">help</span>
</div>
<!-- Tiêu đề hộp thoại -->
<h2 class="text-headline font-headline text-on-surface mb-space-xs" id="dialogTitle">
        Bạn muốn bỏ phiên nghỉ này?
      </h2>
<!-- Nội dung giải thích -->
<p class="text-helper font-helper text-on-surface-variant leading-relaxed mb-space-lg" id="dialogDesc">
        Nếu rời đi bây giờ, thời gian nghỉ chưa hoàn thành sẽ không được ghi nhận vào tiến độ hôm nay.
      </p>
<!-- Hai nút hành động -->
<div class="w-full flex flex-col gap-space-xs">
<!-- Nút 1: Tiếp tục phiên (Primary) -->
<button class="w-full h-[52px] bg-primary-container text-on-primary rounded-[12px] font-label text-label flex items-center justify-center gap-space-xs shadow-[0_2px_8px_rgba(30,90,168,0.15)] active:scale-[0.98] transition-all" id="btnContinue" type="button">
<span class="material-symbols-outlined text-[20px]">play_arrow</span>
<span>Tiếp tục phiên</span>
</button>
<!-- Nút 2: Bỏ phiên (Secondary / Ghost button) -->
<button class="w-full h-12 bg-transparent text-tertiary rounded-[12px] font-label text-label flex items-center justify-center gap-space-xs active:bg-error-container/20 transition-colors" id="btnQuit" type="button">
<span class="material-symbols-outlined text-[18px]">close</span>
<span>Bỏ phiên</span>
</button>
</div>
</div>
</div>
</div>
<script>
  (function() {
    const backdrop = document.getElementById('modalBackdrop');
    const dialogBox = document.getElementById('dialogBox');
    const btnContinue = document.getElementById('btnContinue');
    const btnQuit = document.getElementById('btnQuit');

    function closeModal() {
      if (!backdrop || !dialogBox) return;
      dialogBox.classList.remove('scale-100');
      dialogBox.classList.add('scale-95', 'opacity-0');
      backdrop.classList.add('opacity-0');
      setTimeout(() => {
        backdrop.style.display = 'none';
      }, 200);
    }

    if (btnContinue) {
      btnContinue.addEventListener('click', closeModal);
    }

    if (btnQuit) {
      btnQuit.addEventListener('click', () => {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          closeModal();
        }
      });
    }

    if (backdrop) {
      backdrop.addEventListener('click', (e) => {
        if (e.target === backdrop) {
          closeModal();
        }
      });
    }
  })();
</script></main></body></html>
